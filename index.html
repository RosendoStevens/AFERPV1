<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BizManager ERP</title>
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="auth" hidden></div>
<div id="netbar" hidden>No internet connection. Changes cannot be saved until you are back online.</div>
<div id="app" hidden>
  <div id="scrim" data-act="closeDrawer"></div>
  <aside id="sidebar"></aside>
  <div id="main">
    <header id="topbar">
      <button class="icon-btn menu-btn" data-act="openDrawer" aria-label="Menu" id="menuBtn"></button>
      <h1 id="pageTitle">Dashboard</h1>
      <div class="spacer"></div>
      <button class="icon-btn bell-btn" data-act="openBell" id="bellBtn" aria-label="Notifications" hidden></button>
      <button class="icon-btn" data-act="toggleMode" aria-label="Toggle dark mode" id="modeBtn"></button>
    </header>
    <main id="view"></main>
  </div>
  <nav id="bottomnav"></nav>
</div>
<div id="modal-root"></div>
<div id="toast" role="status"></div>
<div id="print-area"></div>
<script>window.addEventListener('error', function (e) { if (/config\.js/.test(e.filename || '')) window.PP_CONFIG_ERR = e.message || 'error'; });</script>
<script>document.write('<script src="config.js?v=' + Date.now() + '"><\/script>')</script>   <!-- always fetch the latest config.js -->
<script src="js/backend.js"></script>
<script src="js/app.js"></script>
<script src="js/hr.js"></script>
<script src="js/extras.js"></script>
<script src="js/online.js"></script>
</body>
</html>
